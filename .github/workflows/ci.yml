name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROD_TOKEN }}

      - name: Registrar feature en README y subir
        env:
          PAT: ${{ secrets.PROD_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout develop
          
          FEATURE_NAME=$(echo "$COMMIT_MSG" | grep -oE "from [^/]+/(.+)" | sed -E 's/from [^/]+\///' || echo "")
          if [ -z "$FEATURE_NAME" ]; then
            FEATURE_NAME="feature/mi-feature"
          fi
          
          echo "Añadida feature: $FEATURE_NAME" >> README.md
          
          git add README.md
          git commit -m "docs: registrar feature en README [skip ci]" || echo "Sin cambios"
          git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git develop

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN con variable local
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Coinciden DEV_TOKEN"
          } else {
            Write-Host "No coinciden DEV_TOKEN"
            exit 1
          }
