name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar feature en README y subir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          FEATURE_NAME="feature/actualizacion"
          if [ -n "$COMMIT_MSG" ]; then
            FEATURE_NAME="$COMMIT_MSG"
          fi
          
          echo "Añadida feature: $FEATURE_NAME" >> README.md
          
          git add README.md
          git commit -m "docs: registrar feature en README [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, Windows]
    steps:
      - name: Comparar DEV_TOKEN con variable local
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          Write-Host "Comprobando token de desarrollo..."
          $localToken = $env:LOCAL_DEV_TOKEN
          if ([string]::IsNullOrEmpty($localToken)) {
            Write-Host "Error: La variable local LOCAL_DEV_TOKEN no está definida en la máquina."
            exit 1
          }
          
          if ("$env:TOKEN" -eq "$localToken") {
            Write-Host "¡Coinciden DEV_TOKEN correctamente!"
          } else {
            Write-Host "Error: No coinciden los tokens."
            exit 1
          }
        shell: powershell
