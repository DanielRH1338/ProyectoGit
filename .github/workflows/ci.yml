name: CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  validate-dev:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Comparar DEV_TOKEN con variable local
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          Write-Host "Comprobando token de desarrollo..."
          $localToken = $env:LOCAL_DEV_TOKEN
          if ([string]::IsNullOrEmpty($localToken)) {
            Write-Host "Error: La variable local LOCAL_DEV_TOKEN no está definida en la máquina."
            exit 1
          }
          
          if ("$env:TOKEN" -eq "$localToken") {
            Write-Host "¡Coinciden DEV_TOKEN correctamente!"
          } else {
            Write-Host "Error: No coinciden los tokens."
            exit 1
          }
        shell: pwsh
