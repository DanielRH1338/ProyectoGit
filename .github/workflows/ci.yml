name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Simular actualizacion de feature en Ubuntu
        run: |
          echo "Simulando actualizacion de feature para CI"
          echo "Feature procesada correctamente"

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, Windows]
    steps:
      - name: Comparar DEV_TOKEN con variable local
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          Write-Host "Comprobando token de desarrollo..."
          $localToken = $env:LOCAL_DEV_TOKEN
          if ([string]::IsNullOrEmpty($localToken)) {
            Write-Host "Error: La variable local LOCAL_DEV_TOKEN no está definida en la máquina."
            exit 1
          }
          
          if ("$env:TOKEN" -eq "$localToken") {
            Write-Host "¡Coinciden DEV_TOKEN correctamente!"
          } else {
            Write-Host "Error: No coinciden los tokens."
            exit 1
          }
        shell: pwsh
