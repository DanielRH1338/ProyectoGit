name: CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  increment-version:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrementar versión en README o archivo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S")
          echo "AppVersion - Despliegue en Producción a las $TIMESTAMP" >> README.md
          
          git add README.md
          git commit -m "chore: incrementar version de produccion [skip ci]" || echo "Sin cambios"
          git push origin HEAD:${{ github.ref_name }}

  deploy-environment:
    needs: increment-version
    runs-on: [self-hosted, Windows]
    steps:
      - name: Verificar PROD_TOKEN con variable local
        env:
          PROD_SECRET: ${{ secrets.PROD_TOKEN }}
        run: |
          Write-Host "========================================="
          Write-Host "Verificando token de Produccion..."
          $prodToken = $env:PROD_TOKEN
          if (-not [string]::IsNullOrEmpty("$env:PROD_SECRET")) {
            Write-Host "Token de producción validado con éxito."
          } else {
            Write-Host "Error crítico: El token de producción no está disponible."
            exit 1
          }
          Write-Host "========================================="
        shell: pwsh
