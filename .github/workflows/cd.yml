name: CD Workflow

on:
  push:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  deploy-environment:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Descargar codigo actualizado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar entorno y credenciales
        env:
          PROD_SECRET: ${{ secrets.PROD_TOKEN }}
        run: |
          Write-Host "========================================="
          Write-Host "Iniciando proceso de Despliegue Continuo"
          Write-Host "Rama actual detectada: ${{ github.ref_name }}"
          Write-Host "========================================="
        shell: pwsh

      - name: Despliegue en Desarrollo (develop)
        if: github.ref_name == 'develop'
        run: |
          Write-Host "Ejecutando tareas de despliegue para el entorno de desarrollo..."
          Write-Host "Sincronizando archivos con el servidor local de pruebas..."
          Write-Host "Entorno de desarrollo desplegado correctamente."
        shell: pwsh

      - name: Despliegue en Producción (main)
        if: github.ref_name == 'main'
        env:
          PROD_SECRET: ${{ secrets.PROD_TOKEN }}
        run: |
          Write-Host "Verificando seguridad para entorno de producción..."
          if (-not [string]::IsNullOrEmpty("$env:PROD_SECRET")) {
            Write-Host "Token de producción validado con éxito."
            Write-Host "Desplegando versión estable en el entorno de producción..."
          } else {
            Write-Host "Error crítico: El token de producción no está disponible."
            exit 1
          }
        shell: pwsh

      - name: Notificar fin de despliegue
        run: |
          Write-Host "¡Pipeline de CD finalizado con éxito en la máquina local!"
        shell: pwsh
