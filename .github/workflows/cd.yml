name: CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  increment-version:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Simular incremento de version en Ubuntu
        run: |
          echo "Simulando incremento de version para CD"
          echo "Version incrementada correctamente"

  deploy-environment:
    needs: increment-version
    runs-on: [self-hosted, Windows]
    steps:
      - name: Verificar PROD_TOKEN con variable local
        env:
          PROD_SECRET: ${{ secrets.PROD_TOKEN }}
        run: |
          Write-Host "========================================="
          Write-Host "Verificando token de Produccion..."
          $prodToken = $env:PROD_SECRET
          if (-not [string]::IsNullOrEmpty("$env:PROD_SECRET")) {
            Write-Host "Token de producción validado con éxito."
          } else {
            Write-Host "Error crítico: El token de producción no está disponible."
            exit 1
          }
          Write-Host "========================================="
        shell: pwsh
